name: Deploy su Netlify

# Builda a ogni push su main; pubblica su Netlify solo se i secret sono configurati.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Installa dipendenze
        run: npm ci

      - name: Build
        run: npm run build # PDF e icone già versionati in public/ → niente Edge in CI

      - name: Deploy su Netlify (produzione)
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' }}
        run: npx --yes netlify-cli@latest deploy --prod --dir=dist --message "CI ${{ github.sha }}"
