# Configurazione per il deploy su Netlify (gratuito).
# Il PDF (public/Guida-Dieta.pdf) è versionato nel repo, quindi la build in
# cloud NON ha bisogno di rigenerarlo (la rigenerazione richiede Edge/Chrome,
# assente sui server Linux di Netlify). `npm run build` copia public/* in dist/.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Fallback in stile SPA: i file statici (PDF, manifest, sw.js, asset) hanno
# sempre la precedenza; questa regola serve solo se nessun file corrisponde.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
